[customizations.installer.kickstart]
contents = """
# Installer-Sprache vorbelegen; Tastatur und Zeitzone lĂ¤sst Anaconda
# automatisch per Geolocation (GeoIP) ermitteln, daher kein keyboard/timezone.
lang de_DE.UTF-8

# Boot Partitionen
part /boot/efi --fstype=efi --size=256
part /boot --fstype=ext4 --size=2048

# BTRFS Setup: Base-Partition, Pool und Subvolumes
part btrfs.01 --size=1 --grow
btrfs none --label=fedora btrfs.01
btrfs / --subvol --name=root fedora
btrfs /var/home --subvol --name=home fedora

%post --erroronfail
bootc switch --mutate-in-place --transport registry ghcr.io/pm-lucarohde/astroimmutable:latest
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Localization",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]

disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription",
]

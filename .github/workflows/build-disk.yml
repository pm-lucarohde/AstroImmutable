---
name: Build disk images

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build container image"]
    branches:
      - main
    types:
      - completed
  pull_request:
    branches:
      - main
    paths:
      - './disk_config/iso.toml'
      - './.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images
    runs-on: ubuntu-24.04
    # See build.yml; the ISO runs have been taking 17-20 minutes.
    timeout-minutes: 60
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Podman storage
        # bootc-image-builder runs as root and reads the image out of the host's
        # container storage; the runner ships a rootless setup that leaves
        # root's graphroot unusable (bootc-image-builder issue 446).
        run: |
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          sudo tee /etc/containers/storage.conf > /dev/null <<'EOF'
          [storage]
          driver = "overlay"
          runroot = "/run/containers/storage"
          graphroot = "/var/lib/containers/storage"
          EOF

      - name: Build anaconda-iso
        # Inlined on purpose: osbuild/bootc-image-builder-action is archived,
        # and its successor osbuild/image-builder-action drives
        # image-builder-cli, which the action gives no way to hand iso.toml.
        # The builder image itself is still maintained.
        run: |
          sudo podman pull "${BIB_IMAGE}"
          sudo podman pull "${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          mkdir -p output
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            --volume "${PWD}/output":/output \
            --volume "${PWD}/disk_config/iso.toml":/config.toml:ro \
            "${BIB_IMAGE}" \
            build \
            --type anaconda-iso \
            --output /output \
            --chown "${USER_UID}:${USER_GID}" \
            --rootfs btrfs \
            --use-librepo=True \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"

      - name: Upload ISO to Job Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anaconda-iso
          path: output
          if-no-files-found: error
          retention-days: 5
          compression-level: 0
          overwrite: true

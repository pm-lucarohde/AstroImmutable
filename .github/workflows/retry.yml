---
name: Retry failed build

# Same idea as _retry in build.sh, one level up: most aborts are hiccups on the
# other end (crawling mirrors, a half-served download, a dead COPR). Retrying
# inside the job only helps so much, because /var/cache is a cache mount and every
# attempt finds the same broken file again. A new run starts with an empty cache.
on:
  workflow_run:
    workflows: ["Build container image"]
    types:
      - completed

permissions:
  contents: read
  actions: write

jobs:
  retry:
    name: Rerun failed build
    runs-on: ubuntu-24.04
    # The job sleeps for 15 minutes; anything beyond that is a hang.
    timeout-minutes: 30

    # run_attempt counts the run itself, not the retries: 1 and 2 trigger another
    # one, 3 does not. That makes three attempts in total, like _retry.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3

    steps:
      - name: Warten
        run: sleep 900

      - name: Fehlgeschlagene Jobs erneut starten
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run rerun ${{ github.event.workflow_run.id }} --failed

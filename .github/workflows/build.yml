---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    # Caveat on */3: cron is stateless, so this is not "every 3 days" but the
    # fixed set 1,4,7,…,31, restarting on the 1st. After a 31-day month and
    # after February the next run follows earlier — 7 short gaps, 127 runs/year.
    - cron: '57 19 */3 * *'  # 19:57 UTC, every 3rd day of the month
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      # Docs only — would otherwise trigger the build plus the chained ISO build.
      - '**/CLAUDE.md'
  workflow_dispatch:

env:
  IMAGE_DESC: "AstroImmutable Universal Blue Image"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: false

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04

    # Ohne Angabe gälten GitHubs 6 Stunden; ein Lauf an einem hängenden Spiegel
    # verbrennt damit einen halben Tag. Langsamster echter Lauf: 1h26 (#469).
    timeout-minutes: 120

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # Action versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Get current date
        id: date
        run: |
          # ArtifactHub timestamp format, e.g. 2022-02-08T15:38:15Z
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      # Metadata for https://artifacthub.io/ — optional, does nothing on its own.
      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Free disk space before image build
        run: docker system prune -af

      # Rootless podman statt redhat-actions/buildah-build: die Action setzt
      # STORAGE_OPTS=overlay.mount_program=..., sobald fuse-overlayfs auf dem
      # Runner liegt. Seit Runner-Image 20260810 liegt es da (podman-static aus
      # actions/runner-images#14412), und der COMMIT des Images stieg dadurch
      # von 1,7 auf 43 Minuten, der Lint von 9 Sekunden auf 12 Minuten (#468
      # gegen #481). Rootless podman erbt das mount_program aus
      # /etc/containers/storage.conf nicht – containers/storage kopiert in
      # getRootlessStorageOpts nur ignore_chown_errors – und bleibt damit beim
      # Kernel-Overlay. image-template (#261) und Bazzite (033a18f) sind im
      # August aus demselben Grund auf rootless umgestiegen.
      - name: Build Image
        id: build_image
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
          LABELS: ${{ steps.metadata.outputs.labels }}
        run: |
          set -euo pipefail

          # sep-tags trennt die Tags per Leerzeichen, die Labels kommen
          # zeilenweise – sie enthalten selbst welche.
          TAG_ARGS=()
          for tag in ${TAGS}; do
            TAG_ARGS+=("--tag" "${IMAGE_NAME}:${tag}")
          done

          LABEL_ARGS=()
          while IFS= read -r label; do
            if [[ -n "${label}" ]]; then
              LABEL_ARGS+=("--label" "${label}")
            fi
          done <<< "${LABELS}"

          # --layers=true: podman baut anders als "buildah bud" standardmäßig mit
          # Zwischenschichten. Auf dem Kernel-Overlay kosten sie gemessen rund
          # eine Minute (#484: 19,5 gegen 18,0 Minuten in #483); der Abschluss-
          # COMMIT schrumpft dafür von 1,8 Minuten auf 0,06 Sekunden, weil jeder
          # Schritt schon unterwegs committet. Achtung: die 37 Minuten für ein
          # einzelnes printf und die Timeouts in #473/#475 lagen an
          # fuse-overlayfs, nicht an den Schichten – landet der Build je wieder
          # dort (siehe podman-info-Zeile unten), wird genau das hier teuer.
          # --format oci ist Voraussetzung für zstd:chunked beim Push (siehe
          # unten): Docker-Schema-2 kennt nur gzip-Layer, podman schriebe das
          # Manifest beim Push sonst still selbst auf OCI um. Bisher lag auf
          # ghcr Schema 2, weil buildah-build mit oci: false lief – der Wechsel
          # ändert den Digest einmalig, gepinnt wird hier aber nirgends
          # (build-disk.yml und iso.toml ziehen über Tags).
          podman build \
            --file ./Containerfile \
            --format oci \
            --layers=true \
            --pull=newer \
            --retry 3 \
            --retry-delay 30s \
            "${LABEL_ARGS[@]}" \
            "${TAG_ARGS[@]}" \
            .

          # Zeigt im Log, welcher Storage-Pfad benutzt wurde: ein mount_program
          # in den Optionen oder native-diff=false heißt, der Build ist wieder
          # auf dem langsamen Weg gelandet.
          podman info --format \
            'Storage: {{.Store.GraphDriverName}} {{.Store.GraphOptions}} native-diff={{index .Store.GraphStatus "Native Overlay Diff"}}'

      # The `if` guards keep pull requests from publishing packages under your name.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # podman findet die Anmeldedaten der login-action: containers/image liest
      # ~/.docker/config.json, wenn es keine eigene auth.json gibt.
      - name: Push To GHCR
        id: push
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail

          # zstd:chunked statt des Default gzip: kleinere Layer (auf einem
          # /usr/lib64-Sample 144 MiB gzip gegen 134 MiB zstd-3) und ein
          # Datei-Index in den Layer-Annotationen, über den Clients beim Update
          # nur geänderte Teile nachladen können. Level 5 liegt eine Stufe über
          # dem zstd-Default 3, die Skala geht bis 20. --force-compression ist
          # implizit an, sobald --compression-format gesetzt ist; bereits als
          # zstd hochgeladene Blobs werden trotzdem wiederverwendet, die
          # weiteren Tags kosten deshalb nichts.
          for tag in ${TAGS}; do
            podman push \
              --compression-format zstd:chunked \
              --compression-level 5 \
              --retry 3 \
              --retry-delay 30s \
              --digestfile=/tmp/digestfile \
              "${IMAGE_NAME}:${tag}" \
              "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done

          # Alle Tags zeigen auf dasselbe Manifest, der letzte Digest genügt.
          echo "digest=$(< /tmp/digestfile)" >> "${GITHUB_OUTPUT}"

      # Needs the cosign private key in the SIGNING_SECRET repository secret.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          cosign-release: 'v2.6.1'

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            cosign sign -y --key env://COSIGN_PRIVATE_KEY $IMAGE_FULL:$tag
          done
        env:
          TAGS: ${{ steps.push.outputs.digest }}
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

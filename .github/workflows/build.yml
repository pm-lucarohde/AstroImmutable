---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    # Caveat on */3: cron is stateless, so this is not "every 3 days" but the
    # fixed set 1,4,7,…,31, restarting on the 1st. After a 31-day month and
    # after February the next run follows earlier — 7 short gaps, 127 runs/year.
    - cron: '57 19 */3 * *'  # 19:57 UTC, every 3rd day of the month
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      # Docs only — would otherwise trigger the build plus the chained ISO build.
      - '**/CLAUDE.md'
  workflow_dispatch:

env:
  IMAGE_DESC: "AstroImmutable Universal Blue Image"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: false

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04

    # Without a limit GitHub's 6 hours would apply, so one run on a stalled mirror
    # burns half a day. Slowest real run so far: 1h26.
    timeout-minutes: 120

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # Action versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Get current date
        id: date
        run: |
          # ArtifactHub timestamp format, e.g. 2022-02-08T15:38:15Z
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      # Metadata for https://artifacthub.io/ — optional, does nothing on its own.
      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Free disk space before image build
        run: docker system prune -af

      # Rootless podman instead of redhat-actions/buildah-build: that action sets
      # STORAGE_OPTS=overlay.mount_program=... as soon as fuse-overlayfs exists on
      # the runner, which it does since runner image 20260810 — and that pushed the
      # image COMMIT from 1.7 to 43 minutes and the lint from 9 seconds to 12
      # minutes. Rootless podman ignores that mount_program and stays on the kernel
      # overlay.
      - name: Build Image
        id: build_image
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
          LABELS: ${{ steps.metadata.outputs.labels }}
        run: |
          set -euo pipefail

          # sep-tags separates the tags by space, the labels come line by line
          # because they contain spaces themselves.
          TAG_ARGS=()
          for tag in ${TAGS}; do
            TAG_ARGS+=("--tag" "${IMAGE_NAME}:${tag}")
          done

          LABEL_ARGS=()
          while IFS= read -r label; do
            if [[ -n "${label}" ]]; then
              LABEL_ARGS+=("--label" "${label}")
            fi
          done <<< "${LABELS}"

          # --layers=true: unlike "buildah bud", podman builds with intermediate
          # layers by default. On the kernel overlay they cost about a minute,
          # while the final COMMIT drops from 1.8 minutes to 0.06 seconds. The 37
          # minutes for a single printf back then were fuse-overlayfs, not the
          # layers. --format oci is required for zstd:chunked on push, as Docker
          # schema 2 only knows gzip layers; nothing here is pinned by digest.
          podman build \
            --file ./Containerfile \
            --format oci \
            --layers=true \
            --pull=newer \
            --retry 3 \
            --retry-delay 30s \
            "${LABEL_ARGS[@]}" \
            "${TAG_ARGS[@]}" \
            .

          # Shows which podman and which storage path were used: a mount_program
          # in the options or native-diff=false means the build is back on the slow
          # path. The version changes with the runner image and decides which flags
          # the push below understands.
          podman version --format 'Podman: {{.Client.Version}}'
          podman info --format \
            'Storage: {{.Store.GraphDriverName}} {{.Store.GraphOptions}} native-diff={{index .Store.GraphStatus "Native Overlay Diff"}}'

      # The `if` guards keep pull requests from publishing packages under your name.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # podman finds the login action's credentials: containers/image reads
      # ~/.docker/config.json when there is no auth.json of its own.
      - name: Push To GHCR
        id: push
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail

          # zstd:chunked instead of the default gzip: smaller layers plus a file
          # index in the annotations, so clients fetch only changed parts on an
          # update. Level 5 is one step above zstd's default of 3.
          # --retry/--retry-delay only exist in "podman push" from 5.0 on, and the
          # runner is back on Ubuntu's podman 4.9.3, which aborts instantly with
          # "unknown flag: --retry" — hence the shell loop, 3 x 30 s like _retry.
          # 4.9.3 does know the compression flags.
          for tag in ${TAGS}; do
            for attempt in 1 2 3; do
              if podman push \
                --compression-format zstd:chunked \
                --compression-level 5 \
                --digestfile=/tmp/digestfile \
                "${IMAGE_NAME}:${tag}" \
                "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"; then
                break
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "Push von ${tag} nach drei Versuchen aufgegeben" >&2
                exit 1
              fi
              sleep 30
            done
          done

          # All tags point at the same manifest, the last digest is enough.
          echo "digest=$(< /tmp/digestfile)" >> "${GITHUB_OUTPUT}"

      # Needs the cosign private key in the SIGNING_SECRET repository secret.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          cosign-release: 'v2.6.1'

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -euo pipefail

          # Sign the digest, not the tags: they all point at the same manifest,
          # and the signature ends up under sha256-<digest>.sig anyway, where
          # "cosign verify ...:latest" finds it. Tags are deprecated.
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
